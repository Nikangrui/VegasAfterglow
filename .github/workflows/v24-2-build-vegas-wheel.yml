name: Temporary VegasAfterglow Linux wheel for GRB251129A V24.2

on:
  push:
    branches:
      - chatgpt-v24-2-vegas-env

permissions:
  contents: read

jobs:
  build-linux-cp313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary workflow branch
        uses: actions/checkout@v4

      - name: Checkout upstream VegasAfterglow exact latest commit
        uses: actions/checkout@v4
        with:
          repository: YihanWangAstro/VegasAfterglow
          ref: 45f78985f0821740840712a89cc2a2b012c3514f
          path: VegasAfterglow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheel builder
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Apply V24 backend patch to upstream commit
        run: |
          cd VegasAfterglow
          git apply --check ../v24-2/angular-flux-cooling.patch
          git apply ../v24-2/angular-flux-cooling.patch

      - name: Build Linux CPython 3.13 wheel
        run: python -m cibuildwheel VegasAfterglow --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-manylinux_x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_TEST_COMMAND: 'python -c "import VegasAfterglow; from VegasAfterglow import Ejecta; print(VegasAfterglow.__file__)"'
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS='-DAFTERGLOW_MARCH_NATIVE=OFF'"

      - name: Download V24 Python runtime dependencies
        run: |
          mkdir -p wheelhouse/deps
          python -m pip download --only-binary=:all: --dest wheelhouse/deps numpy==2.4.6 scipy==1.18.0 pandas==3.0.5 astropy==8.0.1 matplotlib==3.11.1 dust-extinction==1.7 numba==0.66.0 nbformat==5.10.4 nbclient==0.10.2 ipykernel==6.29.5

      - name: Upload built wheel and runtime dependencies
        uses: actions/upload-artifact@v4
        with:
          name: vegasafterglow-linux-cp313-v24-2
          path: wheelhouse/**
          if-no-files-found: error
          retention-days: 7
